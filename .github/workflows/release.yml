name: Build e release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test
        run: go test ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: zbx-admin-linux-amd64
          - goos: darwin
            goarch: arm64
            name: zbx-admin-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compilar
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          go build -trimpath \
            -ldflags "-s -w -X zbx-admin/internal/cli.Version=${version}" \
            -o "dist/${{ matrix.name }}" \
            ./cmd/zbx-admin

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar binários
        uses: actions/download-artifact@v4
        with:
          pattern: zbx-admin-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum zbx-admin-linux-amd64 zbx-admin-macos-arm64 > SHA256SUMS

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Binários de ${GITHUB_REF_NAME}.

          - \`zbx-admin-linux-amd64\`: Linux x86_64
          - \`zbx-admin-macos-arm64\`: macOS Apple Silicon (arm64)

          Confira \`SHA256SUMS\` antes de instalar.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            dist/zbx-admin-linux-amd64 \
            dist/zbx-admin-macos-arm64 \
            dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md
